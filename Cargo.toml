[package]
name = "jobsmith"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["ekhodzitsky"]
description = "AI-powered job application assistant for HeadHunter (Russia) via Kimi Code"
license = "MIT"
repository = "https://github.com/ekhodzitsky/jobsmith"
keywords = ["cli", "job-search", "headhunter", "resume", "ai"]
categories = ["command-line-utilities"]
# defense-in-depth: keep local artifacts out of the published package
exclude = [".github/", ".kimi/", "kimi-score.svg", "TODO.md", "test_select", "test_writer"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process", "fs"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Database
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }

# Typed errors (no anyhow in the public API)
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# HTML parsing (HH/Habr vacancy descriptions, Habr JSON-LD extraction)
scraper = "0.22"

# XML parsing (Habr Career RSS search feed; std has no XML reader and
# hand-parsing RSS is brittle on CDATA/entities — de-facto standard,
# pure-Rust, MSRV 1.79)
quick-xml = "0.40"

# Fuzzy matching / regex
regex = "1"

# Unicode normalization (for salary lookup)
unicode-normalization = "0.1"

# Configuration
dirs = "6"

# TUI
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"


[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[profile.release]
lto = true
codegen-units = 1
strip = true
